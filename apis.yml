aid: dynamic-xyz
url: https://raw.githubusercontent.com/api-evangelist/dynamic-xyz/refs/heads/main/apis.yml
name: Dynamic
kind: company
description: Dynamic is a wallet and authentication platform offering embedded wallets,
  social/email/passkey login, MPC signers, and a Backend / Admin REST API for managing
  users, wallets, and sessions. Provides SDKs across Web, React, React Native, Flutter,
  Swift, Kotlin, Node.js, Unity.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/dynamic-xyz.png
tags:
  - Web3
  - Wallets
  - Authentication
  - Embedded Wallets
  - MPC
