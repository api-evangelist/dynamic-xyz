    WalletPublicKey:
      type: string
      pattern: ^[A-Za-z0-9]{18,100}$
      description: Valid blockchain wallet address, must be an alphanumeric string without any special characters
      example: '0xbF394748301603f18d953C90F0b087CBEC0E1834'
      maxLength: 255
    EmbeddedWalletSecurityMethod:
      type: string
      enum:
      - passkey
      - passphrase
    ProviderEntryPointVersionEnum:
      type: string
      enum:
      - v6
      - v7
    ProjectSettingsDesignModal:
      type: object
      properties:
        border:
          type: string
        brand:
          type: string
        primaryColor:
          type: string
        radius:
          type: integer
        theme:
          type: string
        view:
          type: string
        template:
          type: string
        displayOrder:
          type: array
          items:
            type: string
        emailOnly:
          type: boolean
        showWalletsButton:
          type: boolean
        emailSubmitButtonInsideInput:
          type: boolean
        splitEmailAndSocial:
          type: boolean
        socialAboveEmail:
          type: boolean
