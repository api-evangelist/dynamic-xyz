      type: string
      enum:
      - text
      - checkbox
      - select
    ProviderKernelVersionEnum:
      type: string
      enum:
      - v2_4
      - v3_0
      - v3_1
      - v3_2
      - v3_3
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    MFAAction:
      type: string
      enum:
      - wallet.waas.sign
      - wallet.waas.export
      - wallet.waas.reshare
      - wallet.waas.refresh
      - user.update
    MobileSettings:
      type: object
      properties:
        deeplinkUrlsEnabled:
          type: boolean
          description: Whether to enable whitelisting mobile deeplink URLs, which will be used for redirecting back to the mobile app. Is required for many features such as social sign in.
    MFASettings:
      type: object
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
        availableMethods:
          type: array
          items:
            $ref: '#/components/schemas/MFADeviceType'
        methods:
          type: array
          items:
            type: object
            required:
            - type
            - enabled
            properties:
              type:
                $ref: '#/components/schemas/MFADeviceType'
              enabled:
                type: boolean
              allowBackupCodes:
                type: boolean
                nullable: true
        actions:
          type: array
          items:
            type: object
            required:
            - action
            - required
            properties:
              action:
                $ref: '#/components/schemas/MFAAction'
              required:
                type: boolean
    NonEmptyStringWith255MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      maxLength: 255
      example: An example name
    CustomFieldValidValue:
      type: object
      required:
