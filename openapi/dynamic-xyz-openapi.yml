          $ref: '#/components/schemas/OptionalNonEmptyStringWith50MaxLength'
        region:
          $ref: '#/components/schemas/OptionalNonEmptyStringWith50MaxLength'
        postalCode:
          $ref: '#/components/schemas/OptionalNonEmptyStringWith50MaxLength'
        country:
          $ref: '#/components/schemas/IsoCountryCode'
    CustomNetworkRequest:
      type: object
      required:
        - networkType
        - chainName
        - chainId
        - rpcUrl
        - blockExplorerUrl
        - iconUrl
        - nativeCurrencyName
        - nativeCurrencySymbol
        - nativeCurrencyIconUrl
        - nativeCurrencyDecimals
      properties:
        networkType:
          $ref: '#/components/schemas/ChainEnum'
        chainName:
          type: string
          pattern: ^(?=\S)[\p{L}\p{N} _.,-]+(?<=\S)$
          maxLength: 100
          description: Name of the custom network
          example: Base Mainnet
        chainId:
          type: string
          pattern: ^[0-9]+$
          maxLength: 100
          description: Chain ID of the network
          example: '8453'
        rpcUrl:
          $ref: '#/components/schemas/NonEmptyUrlWith255MaxLength'
        blockExplorerUrl:
          $ref: '#/components/schemas/NonEmptyUrlWith255MaxLength'
        iconUrl:
          $ref: '#/components/schemas/NonEmptyUrlWith255MaxLength'
        nativeCurrencyName:
          type: string
          pattern: ^(?=\S)[\p{L}\p{N} _.,-]+(?<=\S)$
          maxLength: 100
          description: Full name of the native currency
          example: Ethereum
        nativeCurrencySymbol:
          type: string
          pattern: ^[A-Z0-9]{1,10}$
          maxLength: 100
          description: Symbol of the native currency
          example: ETH
        nativeCurrencyIconUrl:
          $ref: '#/components/schemas/NonEmptyUrlWith255MaxLength'
        nativeCurrencyDecimals:
          type: number
          minimum: 0
          maximum: 18
          description: Number of decimals for the native currency
          example: 18
