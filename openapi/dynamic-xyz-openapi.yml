    CoinbaseOnrampOrderCreateRequest:
      type: object
      required:
        - agreementAcceptedAt
        - destinationAddress
        - destinationNetwork
        - partnerUserRef
        - paymentCurrency
        - paymentMethod
        - purchaseCurrency
      properties:
        agreementAcceptedAt:
          type: string
          format: date-time
          description: >-
            The timestamp of when the user acknowledged that by using Coinbase
            Onramp they are accepting the Coinbase Terms
            (https://www.coinbase.com/legal/guest-checkout/us), User Agreement
            (https://www.coinbase.com/legal/user_agreement),and Privacy Policy
            (https://www.coinbase.com/legal/privacy).
          example: 2025-04-24T00:00:00.000Z
        destinationAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        destinationNetwork:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        domain:
          $ref: '#/components/schemas/origin'
        isQuote:
          type: boolean
          description: >-
            If true, this API will return a quote without creating any
            transaction.
          default: false
        partnerUserRef:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        paymentAmount:
          $ref: '#/components/schemas/NonEmptyAmountString'
        paymentCurrency:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        paymentMethod:
          $ref: '#/components/schemas/CoinbaseOnrampOrderPaymentMethod'
        purchaseAmount:
          $ref: '#/components/schemas/NonEmptyAmountString'
        purchaseCurrency:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
    CoinbaseOnrampOrderResponse:
      type: object
      required:
        - order
      properties:
        order:
          $ref: '#/components/schemas/CoinbaseOnrampOrder'
        paymentLink:
          type: object
          required:
            - url
            - paymentLinkType
          properties:
            url:
              type: string
              description: >-
                The URL to the hosted widget the user should be redirected to.
                For certain payment link types you can append your own
                redirect_url query parameter to this URL to ensure the user is
                redirected back to your app after the widget completes.
              example: >-
                https://pay.coinbase.com/v2/api-onramp/apple-pay?sessionToken=MWYwNWQwODktZTZlYy02OTdlLTgzZTYtMTI3NzcyOWJhNjM3
            paymentLinkType:
              $ref: '#/components/schemas/CoinbaseOnrampOrderPaymentLinkType'
    CryptoDotComPaymentCreateRequest:
      type: object
      required:
        - amount
        - currency
        - walletAddress
        - chain
      properties:
        amount:
          type: number
          description: >-
            A positive integer representing how much to collect in the smallest
            currency unit (e.g., 100 cents to collect $1.00). Refer to [Pricing
            Currencies](https://pay-docs.crypto.com/#api-reference-resources-payments-pricing-currencies)
            for the smallest unit for each currency.
          example: 100
        currency:
          type: string
          description: >-
            Three-letter currency code for the payment amount (pricing
            currency). Must be a supported fiat currency / cryptocurrency. Refer
            to [Pricing
            Currencies](https://pay-docs.crypto.com/#api-reference-resources-payments-pricing-currencies)
            for the currency code.
          example: USD
        description:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        metadata:
          type: object
          description: >-
            Set of key-value pairs that you can attach to an object. This can be
            useful for storing additional information about the object in a
            structured format.
        orderId:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        subMerchantId:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        walletAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        networkId:
          $ref: '#/components/schemas/NonEmptyStringWith50MaxLength'
        chain:
          $ref: '#/components/schemas/ChainEnum'
        merchantName:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
    CryptoDotComPaymentResponse:
      type: object
      required:
        - id
        - amount
        - currency
        - paymentUrl
        - qrCode
        - status
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        amount:
          type: number
          description: >-
            A positive integer representing how much to collect in the smallest
            currency unit (e.g., 100 cents to collect $1.00). Refer to [Pricing
            Currencies](https://pay-docs.crypto.com/#api-reference-resources-payments-pricing-currencies)
            for the smallest unit for each currency.
          example: 2500
        currency:
          type: string
          description: >-
            Three-letter currency code for the payment amount (pricing
            currency). Must be a supported fiat currency / cryptocurrency. Refer
            to [Pricing
            Currencies](https://pay-docs.crypto.com/#api-reference-resources-payments-pricing-currencies)
            for the currency code.
          example: USD
        amountRefunded:
          type: number
          description: >-
            Amount in cents refunded (can be less than the amount of the payment
            if a partial refund was issued).
          example: 0
        created:
          type: number
          description: >-
            Time at which the object was created. Measured in seconds since the
            Unix epoch.
          example: 1555098161
        cryptoCurrency:
          type: string
          description: The cryptocurrency to be collected for this payment.
        cryptoAmount:
          type: string
          description: The amount of cryptocurrency to be collected for this payment.
          example: '1894.8'
        customerId:
          type: string
          description: >-
            ID of the customer created in Crypto.com Pay Merchant Dashboard, if
            exists.
          example: '1234567890'
        paymentUrl:
          type: string
          description: >-
            The URL of the payment page that customers will navigate to in order
            to make the payment.
          example: >-
            https://js.crypto.com/sdk/payments/checkout/set_wallet?publishableKey=XXX&sdkMeta=YYY
        qrCode:
          type: string
        returnUrl:
          type: string
          description: >-
            The URL for payment page to redirect back to when the payment
            becomes succeeded.
          example: http://YOUR_WEBSITE.com/orders/123/complete
        cancelUrl:
          type: string
          description: >-
            The URL for payment page to redirect to when the payment is failed
            or cancelled.
          example: http://YOUR_WEBSITE.com/orders/123/fail
        description:
          type: string
          description: An arbitrary string attached to the object.
          example: Crypto.com Tee (Unisex)
        liveMode:
          type: boolean
          description: >-
            Has the value true if the object exists in live mode or the value
            false if the object exists in test mode.
          example: false
        metadata:
          type: object
          description: >-
            Set of key-value pairs that you can attach to an object. This can be
            useful for storing additional information about the object in a
            structured format.
        orderId:
          type: string
          description: >-
            Merchant provided order ID for this payment. Merchants can view the
            associated order ID of each payment on the Merchant Dashboard.
            Crypto.com Pay does not verify or guarantee the uniqueness of the
            values in this field.
          example: 640cf83d-a316-4030-9878-71be1d98b737
        recipient:
          type: string
          description: The name of the merchant collecting this payment.
          example: Crypto.com Shop
        refunded:
          type: boolean
          description: >-
            Whether the charge has been fully refunded. If the charge is only
            partially refunded, this attribute will still be false.
          example: false
        status:
          type: string
          description: >-
            The status of the payment is either pending (pending payment),
            succeeded (payment captured), or cancelled.
          example: pending
        expiredAt:
          type: number
          description: >-
            Time at which the payment expires. Measured in seconds since the
            Unix epoch.
          example: 1555098461
    CoinbaseOnrampOrder:
