          type: string
        name:
          type: string
    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwksKey'
    JwksKey:
      type: object
      description: >-
        Contains a valid JWKS representation of the public key for this
        environment. For more information, see:
        https://auth0.com/blog/navigating-rs256-and-jwks/
      properties:
        kid:
          type: string
        alg:
          type: string
        kty:
          type: string
        use:
          type: string
        e:
          type: string
        'n':
          type: string
    EncodedJwt:
      type: string
      description: >-
        Encoded JWT token. This will only be returned when cookie-based
        authentication is disabled in favor of standard Auth header based
        authentication.
      example: jwt_value
    VerifyResponse:
      type: object
      required:
        - user
        - expiresAt
      properties:
        mfaToken:
          type: string
        jwt:
          $ref: '#/components/schemas/EncodedJwt'
        user:
          $ref: '#/components/schemas/SdkUser'
        minifiedJwt:
          $ref: '#/components/schemas/EncodedJwt'
        expiresAt:
          description: >-
            Format is a unix-based timestamp. When set, this will be the
            expiration timestamp on the JWT sent using either the `jwt` field or
            a response httpOnly cookie set by the server.
          type: number
          example: '1715620310'
    EmailVerificationCreateResponse:
      type: object
      properties:
        verificationUUID:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
          format: email
      required:
        - verificationUUID
        - email
    SmsVerificationCreateResponse:
      type: object
      properties:
        verificationUUID:
          $ref: '#/components/schemas/uuid'
        phoneNumber:
          description: >-
            This field contains the phone number in the country. This could also
            contain the area code within a country.
          example: '9171113333'
          type: string
        phoneCountryCode:
          description: >-
            This field contains the phone international country code. See
            https://countrycode.org/
          example: '1'
          type: string
        isoCountryCode:
          description: >-
            ISO-3166 two-character country code. See
            https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes
          example: US
          type: string
      required:
        - verificationUUID
        - phoneNumber
        - phoneCountryCode
        - isoCountryCode
    NonceResponse:
      type: object
      properties:
        nonce:
          type: string
    BadRequest:
      type: object
      properties:
        error:
          type: string
    Unauthorized:
      type: object
      properties:
        error:
          type: string
          example: No jwt provided!
    Forbidden:
      type: object
      properties:
        error:
          type: string
          example: Access Forbidden
    UnprocessableEntity:
      type: object
      properties:
        error:
          type: string
