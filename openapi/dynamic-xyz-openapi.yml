    relatedOriginRpId:
      in: query
      name: relatedOriginRpId
      required: false
      description: Related origin rp id
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequest'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    ForbiddenWithErrorAndPayload:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenWithErrorAndPayload'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    MethodNotAllowed:
      description: Method Not Allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MethodNotAllowed'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntity'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequests'
    BadGateway:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadGateway'
  schemas:
    BackupKeySharesToLocationsWithUserIdRequest:
      type: object
      required:
        - userId
        - locations
      properties:
        userId:
          type: string
          format: uuid
          description: The ID of the user who owns the wallet
        locations:
          type: array
          items:
            type: object
            required:
              - location
            properties:
              location:
                $ref: '#/components/schemas/WaasBackupOptionsEnum'
              keygenId:
                $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
              thresholdSignatureScheme:
                $ref: '#/components/schemas/ThresholdSignatureScheme'
              externalKeyShareId:
                $ref: '#/components/schemas/NonEmptyString'
    DelegateOwnershipRequest:
      type: object
      required:
        - adminMemberIdToDelegate
      properties:
        adminMemberIdToDelegate:
          $ref: '#/components/schemas/uuid'
    NameServiceSigningMessageRequest:
      type: object
      required:
        - address
        - domain
        - uri
      properties:
        address:
          $ref: '#/components/schemas/WalletPublicKey'
        domain:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        uri:
          type: string
          format: url
    NameServiceSigningMessage:
      type: object
      required:
        - unsignedMessage
      properties:
        unsignedMessage:
          type: string
          description: >-
            Plaintext message in chain-specific format (eg. SIWE for EVM) that
            needs to be signed with the admin domain address.
    NameServiceResponse:
      type: object
      required:
        - id
        - address
        - domain
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        address:
          $ref: '#/components/schemas/WalletPublicKey'
        domain:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        enabledAt:
          type: string
          description: If the ENS domain is enabled, then this timestamp will be present.
          format: date-time
          nullable: true
    NameServiceCreateRequest:
      type: object
      required:
        - address
        - domain
        - signature
      properties:
        address:
          $ref: '#/components/schemas/WalletPublicKey'
        domain:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        signature:
          type: string
    TestAccountResponse:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        email:
          type: string
        phone:
          type: string
    ValidCustomHostname:
      type: string
      pattern: ^(?!-)[A-Za-z0-9-]+([\-\.]{1}[a-z0-9]+)*\.[A-Za-z]{2,15}$
      maxLength: 255
      example: auth.dynamic.xyz
    CustomHostnameCreateRequest:
      type: object
      required:
        - hostname
        - usage
      properties:
        hostname:
          $ref: '#/components/schemas/ValidCustomHostname'
        usage:
          $ref: '#/components/schemas/CustomHostnameUsageEnum'
    CustomHostnamesResponse:
      type: object
      required:
        - customHostnames
      properties:
        customHostnames:
          type: array
          items:
            $ref: '#/components/schemas/CustomHostname'
    CustomHostnameStatusEnum:
      type: string
      enum:
        - active
        - pending
        - error
    SsoProviderCreateRequest:
      type: object
      required:
        - clientId
        - clientSecret
        - ssoDomain
        - provider
        - emailDomain
      properties:
        clientId:
          type: string
          maxLength: 255
          description: Client ID for the SSO provider
        clientSecret:
          type: string
          maxLength: 255
          description: Client secret for the SSO provider
        ssoDomain:
          type: string
          maxLength: 255
          description: SSO domain for the provider
        emailDomain:
          type: string
          maxLength: 255
          description: Email domain for the company emails to be used for SSO
        provider:
          $ref: '#/components/schemas/SsoProviderEnum'
    SsoProviderUpdateRequest:
      type: object
      properties:
        clientId:
          type: string
          maxLength: 255
          description: Client ID for the SSO provider
        clientSecret:
          type: string
          maxLength: 255
          description: Client secret for the SSO provider
        ssoDomain:
          type: string
          maxLength: 255
          description: SSO domain for the provider
        emailDomain:
          type: string
          maxLength: 255
          description: Email domain for the company emails to be used for SSO
        provider:
          $ref: '#/components/schemas/SsoProviderEnum'
        enforceOnlySSO:
          type: boolean
          description: when set to true it would enforce sso auth to the domain
    WaasDelegatedAccessEncryptionPublicKeyType:
      type: string
      enum:
        - dynamic
        - external
    CustomHostname:
      type: object
      required:
        - id
        - hostname
        - usage
        - status
        - verificationRecords
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        hostname:
          $ref: '#/components/schemas/ValidCustomHostname'
        usage:
          $ref: '#/components/schemas/CustomHostnameUsageEnum'
        status:
          $ref: '#/components/schemas/CustomHostnameStatusEnum'
        verificationRecords:
          type: array
          items:
            $ref: '#/components/schemas/CustomHostnameVerificationRecord'
        errors:
          type: string
    DnsRecordType:
      type: string
      enum:
        - TXT
        - CNAME
    CustomHostnameVerificationType:
      type: string
      enum:
        - certificate
        - ownership
        - alias
    CustomHostnameVerificationRecord:
      type: object
      required:
        - dnsRecordType
        - verificationType
        - name
        - value
      properties:
        dnsRecordType:
          $ref: '#/components/schemas/DnsRecordType'
        verificationType:
          $ref: '#/components/schemas/CustomHostnameVerificationType'
        name:
          type: string
        value:
          type: string
    CustomHostnameUsageEnum:
      type: string
      enum:
        - cookies
        - globalWallet
    DeeplinkUrlResponse:
      type: object
      required:
        - id
        - url
        - createdAt
        - projectEnvironmentId
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        url:
          $ref: '#/components/schemas/deeplinkUrl'
        createdAt:
          type: string
          format: date-time
    DeeplinkUrlsResponse:
      type: object
      required:
        - deeplinkUrls
      properties:
        deeplinkUrls:
          type: array
          items:
            $ref: '#/components/schemas/DeeplinkUrlResponse'
    OauthRedirectRequest:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/OAuthCode'
        state:
          $ref: '#/components/schemas/ValidStringQueryParam'
        id_token:
          $ref: '#/components/schemas/OauthRedirectRequestIdToken'
        error:
          $ref: '#/components/schemas/OAuthError'
    OauthProviderLoginUrl:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: url
    CreateWalletRequest:
      required:
        - publicWalletAddress
        - chain
        - walletName
        - walletProvider
      type: object
      properties:
        publicWalletAddress:
          $ref: '#/components/schemas/WalletPublicKey'
        chain:
          $ref: '#/components/schemas/ChainEnum'
        walletName:
          $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
        walletProvider:
          $ref: '#/components/schemas/WalletProviderEnum'
        additionalWalletAddresses:
          type: array
          items:
            $ref: '#/components/schemas/WalletAdditionalAddress'
    EmailProviderResponse:
      type: object
      required:
        - emailProvider
      properties:
        emailProvider:
          $ref: '#/components/schemas/ProviderEnum'
    OAuthCode:
      type: string
      pattern: ^[a-zA-Z0-9_\.\-\/\\%*!+=]{5,1500}$
      description: Valid oauth code
      example: >-
        4/0AVHEtk436ug4uWwZN9i2PDpxGTVnLr63IqTNFzTInHce1q2JHQyOCJut9IK2SCZh4JaoSA
    OAuthError:
      type: string
      pattern: ^[a-zA-Z_\-]{5,100}$
      description: Valid oauth error
      example: access_denied
    ValidStringQueryParam:
      type: string
      pattern: ^[a-zA-Z0-9 _.,:!?&%@\/'-]*$
      maxLength: 255
      description: ''
    ExportCreateRequest:
      type: object
      description: Request body to create a new export.
      required:
        - format
        - model
      properties:
        format:
          $ref: '#/components/schemas/ExportFormatEnum'
        model:
          $ref: '#/components/schemas/ExportModelEnum'
    ExportFormatEnum:
      type: string
      enum:
        - csv
    ExportModelEnum:
      type: string
      enum:
        - users
        - visits
    ExportStatusEnum:
      type: string
      enum:
        - completed
        - failed
        - pending
    ExportsResponse:
      type: object
      properties:
        exports:
          type: array
          items:
            $ref: '#/components/schemas/Export'
    Export:
      type: object
      required:
        - id
        - format
        - model
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        format:
          $ref: '#/components/schemas/ExportFormatEnum'
        model:
          $ref: '#/components/schemas/ExportModelEnum'
        status:
          $ref: '#/components/schemas/ExportStatusEnum'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        downloadUrl:
          type: string
          format: url
        error:
          description: >-
            When defined, this is the error message and stack trace received
            when attempting to process the export.
          type: string
    AccessOutcomeEnum:
      type: string
      enum:
        - scope
        - siteAccess
        - block
    WhenToImplementEnum:
      type: string
      enum:
        - yesterday
        - nextTwoWeeks
        - nextTwoMonths
        - justBrowsing
    GateCreateRequest:
      type: object
      description: >-
        Request body to create a new gate. The gate will be not enabled by
        default.
      required:
        - name
        - rules
        - outcome
      properties:
        name:
          description: >-
            Human-readable name of the gate. This should be something helpful to
            organize gates.
          example: Super User Gate
          type: string
        outcome:
          $ref: '#/components/schemas/AccessOutcomeEnum'
        scope:
          description: >-
            String for the resulting scope of the gate. If the rules of the gate
            apply to the user being verified, then this scope will be surfaced
            in the JWT. If a scope is not provided for the gate, the default
            behavior of the gate would be to block access to users that the
            rules do not currently apply to.
          example: superuser
          type: string
        rules:
          type: array
          description: >-
            The rules which will be used to evaluate users being verified. If
            multiple rules are present in a single gate, then all the rules need
            to apply for the user to gain the scope defined by the gate.
          items:
            $ref: '#/components/schemas/GateRule'
    GateUpdateRequest:
      type: object
      description: >-
        Request body to update an existing gate. This will not affect whether a
        gate is enabled or not.
      properties:
        name:
          description: >-
            Human-readable name of the gate. This should be something helpful to
            organize gates.
          example: Super User Gate
          type: string
        outcome:
          $ref: '#/components/schemas/AccessOutcomeEnum'
        scope:
          description: >-
            String for the resulting scope of the gate. If the rules of the gate
            apply to the user being verified, then this scope will be surfaced
            in the JWT
          example: superuser
          type: string
        rules:
          type: array
          description: >-
            The rules which will be used to evaluate users being verified. If
            multiple rules are present in a single gate, then all the rules need
            to apply for the user to gain the scope defined by the gate.
          items:
            $ref: '#/components/schemas/GateRule'
    Gate:
      type: object
      required:
        - id
        - name
        - rules
        - outcome
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          description: >-
            Human-readable name of the gate. This should be something helpful to
            organize gates.
          example: Super User Gate
          type: string
        scope:
          description: >-
            String for the resulting scope of the gate. If the rules of the gate
            apply to the user being verified, then this scope will be surfaced
            in the JWT. If a scope is not provided for the gate, the default
            behavior of the gate would be to block access to users that the
            rules do not currently apply to.
          example: superuser
          type: string
        enabledAt:
          type: string
          description: If the gate is enabled, then this timestamp will be present.
          format: date-time
          nullable: true
        rules:
          type: array
          description: >-
            The rules which will be used to evaluate users being verified. If
            multiple rules are present in a single gate, then all the rules need
            to apply for the user to gain the scope defined by the gate.
          items:
            $ref: '#/components/schemas/GateRule'
        outcome:
          $ref: '#/components/schemas/AccessOutcomeEnum'
    GateRule:
      type: object
      description: >-
        Definition for a single rule in a Gate. This will check for the presence
        of a token or NFT, given the contract address, in the wallet of a user
        being evaluated. For multi-wallet users, we will check all wallets. If a
        filter is defined, then we will also check that the filter checks apply
        to the user
      required:
        - type
        - address
      properties:
        type:
          $ref: '#/components/schemas/GateRuleType'
        address:
          $ref: '#/components/schemas/TokenAddress'
        filter:
          $ref: '#/components/schemas/GateRuleFilter'
        chain:
          $ref: '#/components/schemas/ChainEnum'
    GateRuleFilter:
      type: object
      description: Defines the filter properties used for the gate
      properties:
        tokenId:
          $ref: '#/components/schemas/OptionalHexString'
        amount:
          type: number
          description: >-
            Minimum token or NFT amount held by the user. If this `amount` field
            is provided, then Dynamic will also check that the user has this
            minimum amount held by the user of the NFT or Token
    GateRuleType:
      type: string
      enum:
        - nft
        - token
    GatesResponse:
      type: object
      properties:
        gates:
          type: array
          items:
            $ref: '#/components/schemas/Gate'
    TokenAddress:
      description: >-
        Defines one token address connected with network Id on which it's
        working
      type: object
      required:
        - networkId
        - contractAddress
      properties:
        networkId:
          description: Id of the network
          type: number
          example: 1
        contractAddress:
          $ref: '#/components/schemas/WalletPublicKey'
    ChainToken:
      description: >-
