            retrieved again
        checksum:
          type: string
          example: 4n3LFC
          description: >-
            A 6-character alpha-numeric string checksum of the random API Token.
            The last 6 characters of the raw token
        createdBy:
          $ref: '#/components/schemas/TokenCreatedBy'
        active:
          type: boolean
          example: true
          description: Only active tokens can be used.
        createdAt:
          type: string
          format: date-time
        note:
          type: string
        projectEnvironmentId:
          $ref: '#/components/schemas/uuid'
        projectEnvironment:
          type: object
