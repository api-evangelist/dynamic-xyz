openapi: 3.0.1
info:
  title: Dashboard API
  description: Dashboard API documentation
  version: 1.0.0
servers:
  - url: https://app.dynamicauth.com/api/v0
  - url: https://app.dynamic.xyz/api/v0
  - url: http://localhost:3333/api/v0
tags:
  - name: Analytics
  - name: SDK
  - name: Organizations
  - name: Projects
  - name: Environments
  - name: Users
  - name: Invites
  - name: Tokens
  - name: Origins
  - name: Allowlists
  - name: Wallets
  - name: Members
  - name: Sessions
  - name: Settings
  - name: Gates
  - name: Chains
  - name: Exports
  - name: Events
  - name: Webhooks
  - name: Custom Fields
  - name: OrganizationMfaSettings
  - name: CustomHostnames
  - name: TestAccount
  - name: NameServices
  - name: GlobalWallets
  - name: GlobalWalletConnections
  - name: UserApiTokens
  - name: Waas
  - name: WalletConnect
paths:
  /environments/{environmentId}/globalWallet/settings:
    post:
      operationId: createGlobalWalletSettings
      tags:
        - GlobalWallets
      summary: Creates the global wallet settings for the environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalWalletSettingsCreateRequest'
      responses:
        '201':
          description: Successfully created global wallet settings for this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getGlobalWalletSettings
      tags:
        - GlobalWallets
      summary: Get the global wallet settings for environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Returns the global wallet settings for environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateGlobalWalletSettings
      tags:
        - GlobalWallets
      summary: Updates the global wallet settings for the environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalWalletSettingsUpdateRequest'
      responses:
        '200':
          description: Successfully updated global wallet settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/globalWallet/enable:
    put:
      operationId: enableGlobalWallet
      tags:
        - GlobalWallets
      summary: Enable global wallet for this environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Enabled and returns the global wallet settings for this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/globalWallet/disable:
    put:
      operationId: disableGlobalWallet
      tags:
        - GlobalWallets
      summary: Disabled global wallet for this environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Disables and returns the global wallet settings for this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/globalWallet/accessControl:
    get:
      operationId: getGlobalWalletAccessControlList
      tags:
        - GlobalWalletAccessControl
      summary: >-
        Get all the global wallet access control domains for a project
        environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >-
            List of global wallet access control domains for this project
            environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletAccessControlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createGlobalWalletAccessControl
      tags:
        - GlobalWalletAccessControl
      summary: Creates a global wallet access control for this project environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      security:
        - bearerAuth: []
      requestBody:
        description: Fields necessary to create the global wallet access control
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalWalletAccessControlUpdateRequest'
      responses:
        '201':
          description: Global wallet access control was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletAccessControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateGlobalWalletAccessControl
      tags:
        - GlobalWalletAccessControl
      summary: Updates a global wallet access control for this project environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      security:
        - bearerAuth: []
      requestBody:
        description: Fields necessary to update the global wallet access control
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalWalletAccessControlUpdateRequest'
      responses:
        '200':
          description: Global wallet access control was updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletAccessControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/globalWallet/accessControl/enable:
    put:
      operationId: enableGlobalWalletAccessControl
      tags:
        - GlobalWalletAccessControl
      summary: Enable global wallet access control for this environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: >-
            Enables and returns the global wallet access control for this
            environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletAccessControlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/globalWallet/accessControl/disable:
    put:
      operationId: disableGlobalWalletAccessControl
      tags:
        - GlobalWalletAccessControl
      summary: Disabled global wallet access control for this environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: >-
            Disables and returns the global wallet access control for this
            environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletAccessControlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/globalWallet/accessControl/domains:
    post:
      operationId: addGlobalWalletAccessControlDomain
      tags:
        - GlobalWalletAccessControl
      summary: >-
        Adds a domain to be allowed or blocked for global wallet access for this
        project environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      security:
        - bearerAuth: []
      requestBody:
        description: Fields necessary to add the global wallet access control domain
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/GlobalWalletAccessControlDomainCreateRequest
      responses:
        '201':
          description: Global wallet access control domain was added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalWalletAccessControlDomainResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/globalWallet/accessControl/domains/{globalWalletAccessControlDomainId}:
    delete:
      operationId: deleteGlobalWalletAccessControlDomainById
      tags:
        - GlobalWalletAccessControl
      summary: Delete a global wallet access control domain by id
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/globalWalletAccessControlDomainId'
      responses:
        '204':
          description: successful operation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /environments/{environmentId}/globalWallet/connections:
    get:
      operationId: getGlobalWalletConnections
      tags:
        - GlobalWalletConnections
      summary: Get the global wallet connections for this environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - in: query
          name: userId
          schema:
            $ref: '#/components/schemas/uuid'
          required: false
          description: Filter connections by user ID
        - in: query
          name: status
          schema:
            type: string
            enum:
              - connected
              - disconnected
          required: false
          description: Filter connections by status (connected or disconnected)
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: >-
            The number of items to skip before starting to collect the result
            set
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: The numbers of items to return
          required: false
      responses:
        '200':
          description: Returns the global wallet connections for this environment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GlobalWalletConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/nameService/{chainName}:
    post:
      operationId: createNameService
      tags:
        - NameServices
      summary: Create a new name service for the environment and chain
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/chainName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameServiceCreateRequest'
      responses:
        '201':
          description: Successfully created nane service for this environment and chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getNameService
      tags:
        - NameServices
      summary: Get the name service for the environment and chain
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/chainName'
      responses:
        '200':
          description: Get the name service for this environment and chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteNameService
      tags:
        - NameServices
      summary: delete the name service for the environment and chain
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/chainName'
      responses:
        '204':
          description: successful operation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/nameService/{chainName}/signingMessage:
    post:
      operationId: fetchNameServiceSigningMessage
      tags:
        - NameServices
      summary: >-
        Get the unsigned chain-specific message needed to be signed by the
        wallet owner using the wallet private key
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/chainName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameServiceSigningMessageRequest'
      responses:
        '200':
          description: Unsigned SIWE message to sign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameServiceSigningMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/nameService/{chainName}/enable:
    put:
      operationId: enableNameService
      tags:
        - NameServices
      summary: Enable name service for this environment and chain
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/chainName'
      responses:
        '200':
          description: Get the name service for this environment and chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/nameService/{chainName}/disable:
    put:
      operationId: disableNameService
      tags:
        - NameServices
      summary: Disabled name service for this environment and chain
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/chainName'
      responses:
        '200':
          description: Get the name service for this environment and chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/test/account:
    delete:
      operationId: deleteTestAccount
      tags:
        - TestAccount
      summary: Delete the test account for this environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '204':
          description: successful operation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getTestAccount
      tags:
        - TestAccount
      summary: Get the test account for this environemnt
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: List of test account for this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createTestAccount
      tags:
        - TestAccount
      summary: Create a new test account for this environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/custom/hostnames/{customHostnameId}:
    delete:
      operationId: deleteCustomHostname
      tags:
        - CustomHostnames
      summary: Delete the custom hostname
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/customHostnameId'
      responses:
        '204':
          description: successful operation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/custom/hostnames:
    get:
      operationId: getCustomHostnames
      tags:
        - CustomHostnames
      summary: Get the custom hostnames for this environemnt
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: List of custom hostnames for this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomHostnamesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCustomHostname
      tags:
        - CustomHostnames
      summary: Create a new custom hostname for this environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomHostnameCreateRequest'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomHostname'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/exports:
    get:
      operationId: getEnvironmentExports
      tags:
        - Exports
      summary: Get the exports for an environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - in: query
          name: model
          description: The type of data to export
          schema:
            $ref: '#/components/schemas/ExportModelEnum'
      responses:
        '200':
          description: List of exports for this project environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createExport
      tags:
        - Exports
      summary: Create a new export request for the project environment
      parameters:
        - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreateRequest'
      responses:
        '201':
          description: Successfully created export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /environments/{environmentId}/exports/{exportId}/download:
    get:
      operationId: downloadExportById
      tags:
        - Exports
      summary: Download an export by ID
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/exportId'
      responses:
        '302':
          description: Redirect
          content:
            text/csv:
              schema:
                type: string
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /environments/{environmentId}/exports/{exportId}:
    get:
      operationId: getExportById
      tags:
        - Exports
      summary: Get an export using the ID
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/exportId'
      responses:
        '200':
          description: Successfully retrieved an export and its current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /environments/{environmentId}/gates:
    get:
      operationId: getEnvironmentGates
      tags:
