          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDestinationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/waas/delegatedAccess/encryptionPublicKey:
    get:
      operationId: getDelegatedAccessEncryptionPublicKey
      tags:
        - Waas
      summary: Get delegated access encryption public key for an environment
      description: >
        Fetches the encryption public key used for delegated access in a WAAS
        environment.

        By default, returns only the latest active key.
      parameters:
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: Encryption public key fetched successfully
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/DelegatedAccessEncryptionPublicKeyResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sdk/{environmentId}/waas/byWalletAddress/{walletAddress}:
    get:
      operationId: getWaasWalletWithVerifiedCredentials
      tags:
        - SDK
      summary: Fetch a single WaaS wallet with verified credentials
      description: >
        Fetches a single WaaS wallet and returns it with the same payload
        structure as the users endpoint.

        This endpoint returns user information along with verified credentials
        filtered to only include the specified WaaS wallet.
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/walletAddress'
      responses:
        '200':
          description: WaaS wallet fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdkUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /sdk/{environmentId}/chains/{chainName}/transactions/{address}:
    get:
      operationId: getWalletTransactions
      tags:
        - SDK
      summary: Get transactions for a wallet address
      description: >-
        Fetches the list of transactions for a given wallet address within an
        environment.
      parameters:
        - $ref: '#/components/parameters/environmentId'
        - in: path
          name: chainName
          required: true
          schema:
            $ref: '#/components/schemas/ChainEnum'
        - in: path
          name: address
          required: true
          schema:
            $ref: '#/components/schemas/NonEmptyStringWith255MaxLength'
          description: Public key (address) of the wallet
        - in: query
          name: networkId
          schema:
            type: number
          required: true
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
        - in: query
          name: offset
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Wallet transactions fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  /sdk/{environmentId}/ssoProvider:
    post:
      parameters:
        - $ref: '#/components/parameters/environmentId'
      operationId: checkSsoProvider
      tags:
        - SDK
      summary: Check SSO provider for email domain
      description: >-
        Check if an email domain has an associated SSO provider configuration.
        Returns the authentication type (otp or sso) and optionally the provider
        name.
      requestBody:
        description: Email to check for SSO provider
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoProviderCheckRequest'
        required: true
      responses:
        '200':
          description: SSO provider check response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoProviderCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
