        - coinbaseWaas
    EthSolBtcSuiFlowCosmosTronWalletAddress:
      type: string
      pattern: >-
        ^(0x[a-fA-F0-9]{40}|[1-9A-HJ-NP-Za-km-z]{32,44}|(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,70}|0x[a-fA-F0-9]{64}|0x[a-fA-F0-9]{16}|[a-z0-9]{3,16}1[02-9ac-hj-np-z]{38,60}|T[A-Za-z1-9]{33})$
      description: Valid Eth, Solana, Btc, Sui, Flow, Cosmos, and TRON wallet addresses
    HexString:
      type: string
      pattern: ^0x[a-fA-F0-9]*$
    NonEmptyIsoCountryCode:
      type: string
      pattern: ^[a-zA-Z]{2,4}\d?$
      maxLength: 4
      example: US
    PasswordString:
      type: string
      format: password
      pattern: >-
        ^(?=\S)(?=.*[\p{L}])(?=.*[\p{N} _.,:!@#$%^&*?\/+-])[\p{L}\p{N}
        _.,:!@#$%^&*?\/+-]+(?<=\S)$
      minLength: 6
      maxLength: 50
      example: An example password
    NonEmptyString:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
    NonEmptyStringWith50MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
      maxLength: 50
    NonEmptyStringWith255MaxLength:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      maxLength: 255
      example: An example name
    NonEmptyDomainUrlWith255MaxLength:
      type: string
      pattern: >-
        ^[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?)*\.[a-zA-Z]{2,}$|^https?:\/\/[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?)*(\.[a-zA-Z]{2,})?(:\d+)?(\/.*)?$
      maxLength: 255
      example: https://app.xyz.com
    NonEmptyStringWith255MaxLengthAndSpecialChars:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'()\[\]*]+(?<=\S)$
      maxLength: 255
      example: An example name
    NonEmptyBase58StringWith100MaxLength:
      type: string
      pattern: ^[1-9A-HJ-NP-Za-km-z]+$
      maxLength: 100
      description: A base58 string with a max length of 100 characters
    NonEmptyStringWith4096MaxLength:
      type: string
      maxLength: 4096
      description: A string with a max length of 4096 characters
    NonEmptyStringWith16384MaxLength:
      type: string
      maxLength: 16384
      description: A string with a max length of 16384 characters
    NonEmptyAmountString:
      type: string
      pattern: ^(\d+(\.\d+)?|\.\d+)$
      description: Digits with optional decimal part
      example: '100.00'
    ThresholdSignatureScheme:
      type: string
      enum:
        - TWO_OF_TWO
        - TWO_OF_THREE
        - THREE_OF_FIVE
    OptionalBase58StringWith100MaxLength:
      type: string
      pattern: ^$|^[1-9A-HJ-NP-Za-km-z]+$
      maxLength: 100
      description: An optional base58 string with a max length of 100 characters
    OptionalNonEmptyString:
      type: string
      pattern: ^$|^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
    OptionalNonEmptyStringWith50MaxLength:
      type: string
      pattern: ^$|^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
      maxLength: 50
    OptionalNonEmptyStringWith255MaxLength:
      type: string
      pattern: ^$|^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-'|]+(?<=\S)$
      example: An example name
      maxLength: 255
    OptionalNullableNonEmptyStringWith255MaxLength:
      type: string
      pattern: ^$|^(?=\S)[\p{L}\p{N} _.,:!?&%@\/+-]+(?<=\S)$
      example: An example name
      nullable: true
      maxLength: 255
    OptionalNonEmptyStringWith50MaxLengthNoSpecialChars:
      type: string
      pattern: ^$|^(?=\S)[a-zA-Z0-9 ]+(?<=\S)$
      example: Example name 123
      maxLength: 50
    OptionalHexString:
      type: string
      pattern: ^$|^(0x|0X)[a-fA-F0-9]{1,40}$
      example: '0x01'
    NonEmptyUrl:
      type: string
      pattern: >-
        ^(https?:\/\/)?[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}([0-9]{1,5})?(\/.*)?$
      example: https://website-sample.com
    NonEmptyUrlWith255MaxLength:
      type: string
      pattern: >-
        ^(https?:\/\/)?[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}([0-9]{1,5})?(\/.*)?$
      maxLength: 255
      example: https://website-sample.com
    HTTPSUrlOrSNSArn:
      type: string
      pattern: >-
        ^(https:\/\/)[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}(\/.*)?$|^arn:aws:sns:[a-z0-9-]*:[0-9]{12}:[a-zA-Z0-9-_]+$
      example: https://website-sample.com
    OptionalNonEmptyUrl:
      type: string
      pattern: >-
        ^$|^(https?:\/\/)?[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}([0-9]{1,5})?(\/.*)?$
      example: https://website-sample.com
    OptionalNonEmptyIconUrl:
      type: string
      pattern: >-
        ^$|^(https?:\/\/)?[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}([0-9]{1,5})?(\/[^\/]*)*\/[^\/]*\.(?:png|svg)$
      example: https://website-sample/icon.svg
    OptionalNonEmptyCssUrl:
      type: string
      pattern: >-
        ^$|^(https?:\/\/)?[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}([0-9]{1,5})?(\/[^\/]*)*\/[^\/]*\.css$
      example: https://website-sample/custom.css
    OptionalNonEmptyUrlWithLocalhostAndDeepLink:
      type: string
      pattern: >-
        ^$|^((https?:\/\/)?([a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}|localhost)(:[0-9]{1,5})?(\/.*)?|([a-zA-Z+-]{2,20}):\/\/(?!.*\*.*\*.*)[-*a-zA-Z0-9.-\/]{0,255}(:[*0-9]{1,5})?((\/|\?).*)?)$
      example: https://website-sample.com
    OptionalNonEmptyUrlWith255MaxLength:
      type: string
      pattern: >-
        ^$|^(https?:\/\/)?[a-z0-9]+([-.]+[a-z0-9]+)*\.[a-z]{2,10}([0-9]{1,5})?(\/.*)?$
      example: https://website-sample.com
      maxLength: 255
    OptionalNonEmptyMarkdownText:
      type: string
      pattern: ^$|^(?!.*&lt;[^&]+&gt;)[a-zA-Z0-9\s\/;:\*\-\(\)\[\]%#@'"\\.,=+\$&]+$
      example: >-
        This is a markdown example with a **bold** text and a
        [link](https://website-sample.com)
      maxLength: 1024
    WalletBitcoinConfig:
      type: object
      properties:
        addressType:
          type: string
        network:
          type: string
    WalletPublicKey:
      type: string
      pattern: ^[A-Za-z0-9]{18,100}$
      description: >-
        Valid blockchain wallet address, must be an alphanumeric string without
        any special characters
      example: '0xbF394748301603f18d953C90F0b087CBEC0E1834'
      maxLength: 255
    SolanaPublicKey:
      type: string
      pattern: ^[1-9A-HJ-NP-Za-km-z]{43,44}$
      description: >-
        Valid Solana wallet address, must be a 44-character string using base58
        characters
      example: vines1vzrYbzLMRdu58ou5XTby4qAqVRLmqo36NKPTg
    WalletConnectorKey:
      type: string
      pattern: ^(?=\S)[\p{L}\p{N}a-zA-Z _.,:!?&%@\/+\-']+(?<=\S)$
      minLength: 2
      maxLength: 50
      example: metamask
    JwtVerifiedCredentialHashes:
      type: object
      description: >-
        This contains the hashed string of the concatenated verified credential
        IDs grouped by credential format.
      properties:
        blockchain:
          type: string
        email:
          type: string
        oauth:
          type: string
        phoneNumber:
          type: string
        externalUser:
          type: string
    MinifiedDynamicJwt:
      type: object
      description: >-
        This contains standard JWT claims to identify a session for the Dynamic
        user. For more details, see:
        https://www.iana.org/assignments/jwt/jwt.xhtml#claims
      required:
        - kid
        - aud
        - iss
        - sub
        - sid
        - environment_id
        - last_verified_credential_id
      properties:
        kid:
          type: string
          description: >-
            Project environment jwt public key id, used to verify the jwt using
            the the jwks endpoint
        aud:
          type: string
          description: >-
            Audience: this will be the origin header, pertaining to the client
            site
        iss:
          type: string
          description: 'Issuer: current backend api host + environment id'
        sub:
          type: string
          description: Dynamic user ID
        sid:
          type: string
          description: Dynamic session ID
        exp:
          type: number
          description: Expiration timestamp
        iat:
          type: number
          description: Timestamp for when the JWT was issued at
        environment_id:
          description: Dynamic environment ID
          type: string
        last_verified_credential_id:
          description: >-
            ID of the most recently used verified credential. This would refer
            to a value in the verified credentials list in the corresponding
            SdkUser
          type: string
        session_public_key:
          type: string
          description: Client session public key
        scope:
          type: string
          description: >-
            A whitespace-separate list of permissions associated with the JWT
            token issued. This conforms to the JWT standard for scope claims:
            https://datatracker.ietf.org/doc/html/rfc8693#section-4.2
          example: superuser marketing operations
        verifiedCredentialsHashes:
          $ref: '#/components/schemas/JwtVerifiedCredentialHashes'
        email:
          type: string
        username:
          type: string
        server_auth:
          type: boolean
        hashed_ip:
          type: string
          description: Hashed IP address
        originalSid:
          type: string
          description: Original session ID
        refreshExp:
          type: number
          description: Refresh expiration timestamp
        sdkVersion:
          type: string
          description: SDK version used to create this JWT (e.g., WalletKit/1.2.3)
    DynamicJwt:
      type: object
      required:
        - kid
        - aud
        - iss
        - sub
        - sid
        - environment_id
        - missing_fields
        - verified_credentials
        - last_verified_credential_id
      properties:
        kid:
          type: string
        aud:
          type: string
        iss:
          type: string
        sub:
          type: string
        exp:
          type: number
        iat:
          type: number
        sid:
          type: string
        session_public_key:
          type: string
        alias:
          type: string
        blockchain_accounts:
          type: array
          items:
            $ref: '#/components/schemas/JwtBlockchainAccount'
        country:
          type: string
        email:
          type: string
          format: email
        environment_id:
          $ref: '#/components/schemas/uuid'
        family_name:
          type: string
        given_name:
          type: string
        job_title:
          type: string
        last_authenticated_account_id:
          $ref: '#/components/schemas/uuid'
        lists:
          type: array
          items:
            type: string
        phone_number:
          type: string
        missing_fields:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSettingsKyc'
        scope:
          type: string
          description: >-
            A whitespace-separate list of permissions associated with the JWT
            token issued. This conforms to the JWT standard for scope claims:
            https://datatracker.ietf.org/doc/html/rfc8693#section-4.2
          example: superuser marketing operations
        t_shirt_size:
          type: string
        team:
          type: string
        username:
          type: string
        policies_consent:
          type: boolean
        verified_account:
          $ref: '#/components/schemas/JwtBlockchainAccount'
        verified_credentials:
          type: array
          items:
            $ref: '#/components/schemas/JwtVerifiedCredential'
        last_verified_credential_id:
          $ref: '#/components/schemas/uuid'
        first_visit:
          type: string
          format: date-time
        last_visit:
          type: string
          format: date-time
        new_user:
          type: boolean
        btc_wallet:
          type: string
        kda_wallet:
          type: string
        ltc_wallet:
          type: string
        ckb_wallet:
          type: string
        kas_wallet:
          type: string
        doge_wallet:
          type: string
        email_notification:
          type: boolean
        discord_notification:
          type: boolean
        newsletter_notification:
          type: boolean
        metadata:
          type: object
        verifiedCredentialsHashes:
          $ref: '#/components/schemas/JwtVerifiedCredentialHashes'
        info:
          $ref: '#/components/schemas/JwtPayloadDeprecatedInfo'
        server_auth:
          type: boolean
        hashed_ip:
          type: string
          description: Hashed IP address
        originalSid:
          type: string
          description: Original session ID
        refreshExp:
          type: number
          description: Refresh expiration timestamp
        sdkVersion:
          type: string
          description: SDK version used to create this JWT (e.g., WalletKit/1.2.3)
    JwtPayloadDeprecatedInfo:
      type: object
      required:
        - environmentId
      properties:
        alias:
          type: string
        chain:
          $ref: '#/components/schemas/ChainEnum'
        email:
          type: string
          format: email
        ens:
          $ref: '#/components/schemas/NameServiceData'
        environmentId:
          $ref: '#/components/schemas/uuid'
        firstName:
          type: string
        jobTitle:
          type: string
        lastName:
          type: string
        lists:
          type: array
          items:
            type: string
        phoneNumber:
          type: string
        tShirtSize:
          type: string
        userId:
          $ref: '#/components/schemas/uuid'
        username:
          type: string
        wallet:
          type: string
        walletPublicKey:
          $ref: '#/components/schemas/uuid'
    JwtVerifiedCredentialFormatEnum:
      type: string
      enum:
        - blockchain
        - email
        - oauth
        - passkey
        - phoneNumber
        - externalUser
    JwtVerifiedCredential:
      type: object
      required:
        - id
        - format
        - signInEnabled
      properties:
        address:
          $ref: '#/components/schemas/WalletPublicKey'
        chain:
          type: string
        refId:
          $ref: '#/components/schemas/uuid'
        signerRefId:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
          format: email
        id:
          $ref: '#/components/schemas/uuid'
        name_service:
          $ref: '#/components/schemas/NameServiceData'
        public_identifier:
          description: >-
            This is used to publicly identify a verified credential in a
            human-friendly way. For example, this will be the email address if
            credential format=email.
          type: string
        wallet_name:
          type: string
        wallet_provider:
          $ref: '#/components/schemas/WalletProviderEnum'
        wallet_properties:
          $ref: '#/components/schemas/WalletProperties'
        format:
          $ref: '#/components/schemas/JwtVerifiedCredentialFormatEnum'
        oauth_provider:
          $ref: '#/components/schemas/ProviderEnum'
        oauth_username:
          type: string
        oauth_display_name:
          type: string
          nullable: true
        oauth_account_id:
          type: string
          nullable: true
        phoneNumber:
          description: >-
            This field contains the phone number in the country. This could also
            contain the area code within a country.
          example: '9171113333'
          type: string
        phoneCountryCode:
          description: >-
            This field contains the phone international country code. See
            https://countrycode.org/
          example: '1'
          type: string
        isoCountryCode:
          description: >-
            ISO-3166 two-character country code. See
            https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes
          example: US
          type: string
        oauth_account_photos:
          type: array
          items:
            type: string
        oauth_emails:
          type: array
          items:
            type: string
        oauth_metadata:
          type: object
          description: >-
            This object contains JSON metadata for a social-based verified
            credential. It may contain data about the user that does not fit
            into the other structured fields, and could include arbitrary fields
            about the user from the oauth provider's API.
        previous_users:
          description: >-
            This will only be provided in the responses for GET
            /users/{userId}.Previous user IDs that owned this verified
            credential and was tranfered to the current user ID.
          type: array
          items:
            $ref: '#/components/schemas/uuid'
        embedded_wallet_id:
          type: string
          nullable: true
        wallet_additional_addresses:
          type: array
          items:
            $ref: '#/components/schemas/WalletAdditionalAddress'
        lastSelectedAt:
          description: >-
            This timestamp indicates the last time this verified wallet was
            either connected to the user account or selected to become the
            primary wallet on the account.
          type: string
          format: date-time
        signInEnabled:
          type: boolean
          description: This indicates if the user can sign in with this credential
        verifiedAt:
          type: string
          format: date-time
          description: >-
            This timestamp indicates the last time this verified credential was
            verified.
    JwtBlockchainAccount:
      type: object
      required:
        - address
        - chain
        - id
        - wallet_name
        - wallet_provider
      properties:
        address:
