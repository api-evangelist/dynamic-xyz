          items:
            type: object
            required:
              - chain
              - toAddresses
              - valueLimits
            properties:
              chain:
                $ref: '#/components/schemas/WaasChainEnum'
              toAddresses:
                type: array
                minItems: 1
                description: >-
                  Array of allowed recipient addresses (vault addresses) for
                  this chain
                items:
                  anyOf:
                    - $ref: '#/components/schemas/WalletPublicKey'
                    - $ref: '#/components/schemas/SolanaPublicKey'
              valueLimits:
                type: array
                minItems: 1
                description: Array of value limits for different assets on this chain
                items:
                  type: object
                  required:
                    - asset
                    - maxPerCall
                  properties:
                    asset:
                      description: Target asset address
                      anyOf:
                        - $ref: '#/components/schemas/WalletPublicKey'
                        - $ref: '#/components/schemas/SolanaPublicKey'
                    maxPerCall:
                      type: string
                      description: >-
