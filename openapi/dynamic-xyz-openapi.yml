          type: string
          format: date-time
          nullable: true
        clientId:
          description: >-
            Standard OAuth client ID. For more information, see:
            https://www.oauth.com/oauth2-servers/client-registration/client-id-secret/
          type: string
        clientSecret:
          description: >-
            Standard OAuth client secret key. For more information, see:
            https://www.oauth.com/oauth2-servers/client-registration/client-id-secret/
          type: string
