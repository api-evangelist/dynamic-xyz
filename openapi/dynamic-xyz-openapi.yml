              type: string
              format: date-time
              description: >-
                When provided, the user email will be marked as verified in our
                system and the user will be allowed to sign in with that email.
                When social is enabled and the social provider has a verified
                email, we will automatically associate that social with the
                existing user.
            email:
              $ref: '#/components/schemas/updatableEmailOrEmptyString'
            wallets:
              type: array
              items:
                $ref: '#/components/schemas/CreateWalletRequest'
            oauthAccounts:
              type: array
              items:
                $ref: '#/components/schemas/CreateUserOauthRequest'
    updatableEmailOrEmptyString:
      type: string
      description: >-
        If email is trusted and verified, please provide a emailVerifiedAt
        timestamp. This will ensure that a user signing in with this email can
        access the correctly-created user account.
      pattern: >-
        ^$|(^([!#-'*+\/-9=?A-Z^-~-]+(\.[!#-'*+\/-9=?A-Z^-~-]+)*|"([]!#-[^-~
        \t]|([\t -~]))+")@([!#-'*+\/-9=?A-Z^-~-]+(\.[!#-'*+\/-9=?A-Z^-~-]+)*|[\t
        -Z^-~]*)$)
      example: hello-world@foobar.com
      maxLength: 255
