        password:
          $ref: '#/components/schemas/SupportedSecurityMethod'
    SupportedSecurityMethod:
      type: object
      required:
        - isDefault
        - isEnabled
        - isPermanentAuthenticator
        - listPosition
      properties:
        isDefault:
          type: boolean
        isEnabled:
          type: boolean
        isPermanentAuthenticator:
          type: boolean
        listPosition:
          type: number
    SdkSettingsRequest:
      type: object
      properties:
        dynamicContextProps:
          type: object
        dynamicWagmiSettings:
          type: object
