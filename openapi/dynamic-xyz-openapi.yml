        - symbol
        - tokenAddresses
      properties:
        name:
          description: Name of the token
          type: string
          example: Shiba Inu
        symbol:
          description: Symbol of the token
          type: string
          example: SHIB
        tokenAddresses:
          description: Array of different contract addresses dependent to networkId
          type: array
          items:
            $ref: '#/components/schemas/TokenAddress'
    ChainTokensResponse:
      type: array
