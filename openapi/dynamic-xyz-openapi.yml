        email:
          type: string
          format: email
          maxLength: 255
        captchaToken:
          $ref: '#/components/schemas/captchaToken'
    captchaToken:
      type: string
      description: >-
        When provided, used to verify that a captcha is valid and get the
        success/failure result from the captcha provider server-side.
    caip2:
      description: >-
        CAIP-2 Chain ID
        (https://github.com/ChainAgnostic/CAIPs/blob/main/CAIPs/caip-2.md)
      type: string
      pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
      minLength: 5
      maxLength: 41
      example: eip155:1
    uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      example: 95b11417-f18f-457f-8804-68e361f9164f
    sixDigitsVerificationToken:
      type: string
      pattern: ^[0-9]{6}$
      example: '123456'
      description: A 6-digit number
    origin:
      type: string
      pattern: >-
        ^(https?|chrome-extension|moz-extension):\/\/(?!.*(\*).*(\*).*)[*a-zA-Z0-9._-]{1,256}(:[*0-9]{1,5})?$
      description: >-
        An [RFC 6454](https://www.rfc-editor.org/rfc/rfc6454) valid url. Must
        not include any paths. A single wildcard (*) can be used as the first
        subdomain.
      example: http://*.example.com
    deeplinkUrl:
      type: string
      pattern: >-
        ^([a-zA-Z+-]{2,20}):\/\/(?!.*\*.*\*.*)[-*a-zA-Z0-9.-\/]{0,255}(:[*0-9]{1,5})?((\/|\?).*)?$
      description: >-
        A valid deeplink url. Accepts custom schemes. Must not include any
        paths. A single wildcard (*) can be used as the first subdomain.
      example: mydemoapp://*.redirect
    orderBy:
      type: string
      description: $COLUMN_NAME-asc|desc
      pattern: ^[A-Za-z]*-(asc|desc)$
      example: something-asc
