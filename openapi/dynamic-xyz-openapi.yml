    Username:
      type: string
      nullable: true
      description: Alphanumeric with slugs and underscores username
      pattern: ^$|^[\p{L}\p{N}_-]{3,20}$
      example: johndoe
      maxLength: 255
    CountryCode:
      type: string
      nullable: true
      description: Standard ISO 3166-1 alpha-2 two-letter country code
      pattern: ^[A-Z]{2}$
      example: US
      maxLength: 255
    btcWalletString:
      type: string
      description: BTC wallet address
      pattern: ^(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,59}$
      example: 3FZbgi29cpjq2GjdwV8eyHuJJnkLtktZc5
      nullable: true
    ltcWalletString:
      type: string
      description: LTC wallet address
      pattern: ^[LM3][a-km-zA-HJ-NP-Z1-9]{26,53}$
      example: LUttH43tQ4x4qniCKr1Rqo8ESeXFPdv9ax
      nullable: true
    dogeWalletString:
      type: string
      description: DOGE wallet address
      pattern: ^D[a-zA-Z0-9_.-]{33}$
      example: DPcy35vmuk8GXcfu1vgFFEeij3BuYYJQKB
      nullable: true
    kdaWalletString:
      type: string
      description: KDA wallet address
      pattern: ^k:[0-9a-fA-F]{64}$
      example: k:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
      nullable: true
    kasWalletString:
      type: string
      description: KAS wallet address
      pattern: >-
        ^kaspa:[1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz]{56,}$
      example: kaspa:qrelgny7sr3vahq69yykxx36m65gvmhryxrlwngfzgu8xkdslum2yxjp3ap8m
      nullable: true
    ckbWalletString:
      type: string
      description: CKB wallet address
      pattern: ^(ckb1q|ckt1q)[0-9a-z]{25,111}$
      example: ckt1q9876543210abcdefghijklmnopqrstuvwxyz
      nullable: true
    emailOrEmptyString:
      type: string
      pattern: >-
        ^$|(^([!#-'*+\/-9=?A-Z^-~-]+(\.[!#-'*+\/-9=?A-Z^-~-]+)*|"([]!#-[^-~
        \t]|([\t -~]))+")@([!#-'*+\/-9=?A-Z^-~-]+(\.[!#-'*+\/-9=?A-Z^-~-]+)*|[\t
        -Z^-~]*)$)
      example: hello-world@foobar.com
      maxLength: 255
    phoneNumberOrEmptyString:
      type: string
      pattern: ^(\+[1-9]\d{1,14})?$
      example: '+1234567890'
      maxLength: 255
    NameService:
      type: object
      properties:
        registry:
          type: string
          example: '0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e'
    Network:
      type: object
      properties:
        networkId:
          type: number
          example: '1'
        chainName:
          type: string
          example: Ethereum Mainnet
        enabled:
          type: boolean
        rpcUrl:
          type: string
        iconUrl:
          type: string
        type:
          type: string
          enum:
            - custom
            - default
      required:
        - networkId
        - enabled
        - chainName
    NativeCurrency:
      type: object
      properties:
        decimals:
          type: number
          example: '18'
        name:
          type: string
          example: Ether
        symbol:
          type: string
          example: ETH
        denom:
          type: string
          example: uatom
        iconUrl:
          type: string
        pricingProviderTokenId:
          type: string
      required:
        - decimals
        - name
        - symbol
    NetworkConfiguration:
      type: object
      properties:
        lcdUrl:
          type: string
          example: https://lcd.osmosis.zone
          description: >-
            A light client, compared to a full node, tracks only pieces of
            certain information on a blockchain. Light clients do not track the
            entire state of a blockchain and also do not contain every
            transaction/block of a chain.
        chainName:
          type: string
          description: '[Deprecated] use `name` property instead'
          example: Ethereum Mainnet
        key:
          type: string
          example: ethereum
        name:
          type: string
          example: Ethereum Mainnet
        shortName:
          type: string
          example: ETH
        isTestnet:
          type: boolean
          example: false
        chain:
          type: string
          example: ETH
        chainId:
          type: string
          example: '1'
        nameService:
          $ref: '#/components/schemas/NameService'
        networkId:
          type: string
          example: '1'
        iconUrls:
          type: array
          items:
            type: string
        nativeCurrency:
          $ref: '#/components/schemas/NativeCurrency'
        rpcUrls:
          type: array
          items:
            type: string
            example: https://mainnet.infura.io/v3/
        privateCustomerRpcUrls:
          type: array
          description: Contains the client private RPC urls
          items:
            type: string
            example: https://mainnet.infura.io/v3/
        blockExplorerUrls:
          type: array
          items:
            type: string
            example: https://etherscan.io/
        vanityName:
          type: string
          example: Ethereum
        bech32Prefix:
          type: string
          example: cosmos
        genesisHash:
          type: string
          example: 5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
        cluster:
          type: string
          example: mainnet, devnet, etc
      required:
        - name
        - shortName
        - chain
        - chainId
        - networkId
        - iconUrls
        - nativeCurrency
        - rpcUrls
        - blockExplorerUrls
    NetworkConfigurationResponse:
      type: object
      properties:
        chainName:
          type: string
        networks:
          type: array
          items:
